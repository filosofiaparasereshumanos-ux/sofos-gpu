> Copia este archivo en tu repositorio de GitHub como
> `.github/workflows/docker-image.yml` (mismo contenido, sin esta linea).

name: build-sofos-gpu-image

on:
  workflow_dispatch:
  push:
    paths:
      - "gpu-image/**"
      - ".github/workflows/docker-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Libera espacio: la imagen con modelos pesa varios GB.
      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - uses: docker/setup-buildx-action@v3

  - uses: docker/login-action@v3
  with:
    registry: docker.io
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}


      - uses: docker/build-push-action@v6
        with:
          context: gpu-image
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sofos-gpu:v1
