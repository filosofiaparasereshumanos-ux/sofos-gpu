<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Estadísticas · Odisea de la Razón</title>
<style>
  :root { --bg: #14100a; --card: #1f1810; --line: #4a3a20; --gold: #e2b04e; --tx: #f3e6c4; --mut: #b8a888; --ok: #8fd36a; --bad: #ff8a70; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.45 Georgia, serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.5rem; color: var(--gold); margin: 0 0 4px; }
  p.sub { color: var(--mut); margin: 0 0 18px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .bar button { background: var(--card); color: var(--tx); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; }
  .bar button.on { background: var(--gold); color: #1a1206; border-color: var(--gold); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 1.5rem; color: #fff; } .kpi span { color: var(--mut); font-size: .85rem; }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid #2e2414; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #261d12; color: var(--gold); font-weight: normal; font-size: .82rem; letter-spacing: .04em; cursor: pointer; position: sticky; top: 0; }
  td.bad { color: var(--bad); } td.ok { color: var(--ok); }
  .meter { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: #33281a; vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--gold); }
  #msg { color: var(--mut); padding: 20px 0; }
</style>
</head>
<body>
<main>
  <h1>Estadísticas anónimas</h1>
  <p class="sub">Solo contadores por día y época: nadie aparece aquí. «Atasco» es el porcentaje de debates perdidos sobre los jugados en esa época: las épocas con el atasco más alto son las que conviene revisar.</p>
  <div class="bar" id="dias"><button data-d="1">Hoy</button><button data-d="7" class="on">7 días</button><button data-d="30">30 días</button><button data-d="365">Un año</button></div>
  <div class="kpis" id="kpis"></div>
  <div class="wrap"><table><thead><tr id="hd"></tr></thead><tbody id="tb"></tbody></table></div>
  <p id="msg">Cargando…</p>
</main>
<script>
const URL_ = 'https://xmslbqzmztcaoddchzsz.supabase.co', KEY = 'sb_publishable_5yoU56-AIWpkIelBPgeqPw_ydkMGEdk';
const COLS = [['era', 'Época'], ['entra', 'Entradas'], ['vence', 'Debates ganados'], ['maestro', 'Maestros'], ['derrota', 'Derrotas'], ['atasco', 'Atasco'], ['acierto', 'Aciertos'], ['fallo', 'Fallos'], ['tiempo', 'Sin tiempo'], ['precision', 'Precisión']];
let rows = [], sortK = 'entra', dias = 7;
const fmt = (n) => Number(n || 0).toLocaleString('es-ES');
async function load() {
  document.getElementById('msg').textContent = 'Cargando…';
  try {
    const r = await fetch(URL_ + '/rest/v1/rpc/odisea_metricas_ver', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_dias: dias }) });
    if (!r.ok) throw new Error(r.status === 404 ? 'Falta ejecutar tools/cuentas4.sql en Supabase.' : 'Error ' + r.status);
    const data = await r.json(); const by = {}; const tot = {};
    for (const x of data) { tot[x.evento] = (tot[x.evento] || 0) + Number(x.n); if (!x.era) continue; (by[x.era] = by[x.era] || { era: x.era })[x.evento] = Number(x.n); }
    rows = Object.values(by).map((o) => { const jug = (o.vence || 0) + (o.maestro || 0) + (o.derrota || 0); const resp = (o.acierto || 0) + (o.fallo || 0) + (o.tiempo || 0); return { ...o, atasco: jug ? (o.derrota || 0) / jug : 0, precision: resp ? (o.acierto || 0) / resp : 0 }; });
    const g = (tot.guia_fin || 0) + (tot.guia_salta || 0);
    document.getElementById('kpis').innerHTML = [[fmt(tot.sesion), 'Partidas abiertas'], [fmt(tot.entra), 'Entradas en épocas'], [fmt((tot.vence || 0) + (tot.maestro || 0)), 'Debates ganados'], [g ? Math.round((tot.guia_fin || 0) / g * 100) + ' %' : '—', 'Terminan la guía inicial'], [fmt(tot.torneo), 'Torneos de trivia']].map(([v, k]) => `<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join('');
    document.getElementById('msg').textContent = rows.length ? '' : 'Todavía no hay datos en este periodo.';
    paint();
  } catch (e) { document.getElementById('msg').textContent = e.message; }
}
function paint() {
  document.getElementById('hd').innerHTML = COLS.map(([k, t]) => `<th data-k="${k}">${t}${sortK === k ? ' ▾' : ''}</th>`).join('');
  const r = [...rows].sort((a, b) => sortK === 'era' ? a.era.localeCompare(b.era) : (b[sortK] || 0) - (a[sortK] || 0));
  document.getElementById('tb').innerHTML = r.map((o) => '<tr>' + COLS.map(([k]) => {
    if (k === 'era') return `<td>${o.era}</td>`;
    if (k === 'atasco' || k === 'precision') { const p = Math.round(o[k] * 100); const cls = k === 'atasco' ? (p >= 40 ? 'bad' : '') : (p >= 70 ? 'ok' : p < 50 ? 'bad' : ''); return `<td class="${cls}">${p} %<span class="meter"><i style="width:${p}%"></i></span></td>`; }
    return `<td>${fmt(o[k])}</td>`;
  }).join('') + '</tr>').join('');
  document.querySelectorAll('#hd th').forEach((th) => th.onclick = () => { sortK = th.dataset.k; paint(); });
}
document.querySelectorAll('#dias button').forEach((b) => b.onclick = () => { dias = +b.dataset.d; document.querySelectorAll('#dias button').forEach((x) => x.classList.toggle('on', x === b)); load(); });
load();
</script>
</body>
</html>
