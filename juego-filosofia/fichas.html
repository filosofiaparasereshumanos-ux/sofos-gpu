<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fichas para el aula · Odisea de la Razón</title>
<style>
  :root { --tx: #1d1a14; --mut: #6b6252; --line: #d8cdb6; --gold: #9a6b14; --bg: #fbf8f1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 16px/1.5 Georgia, 'Times New Roman', serif; }
  .bar { position: sticky; top: 0; z-index: 2; background: #2a2012; color: #f6ead0; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar b { font-size: 1.05rem; margin-right: 8px; } .bar select, .bar button { font: inherit; font-size: .9rem; padding: 6px 10px; border-radius: 8px; border: 1px solid #8a6a30; background: #3a2c16; color: #f6ead0; }
  .bar button { background: #e2b04e; color: #1a1206; border-color: #e2b04e; cursor: pointer; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 18px 60px; }
  .ficha { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 28px 32px; margin-bottom: 28px; }
  .eyebrow { font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  h1 { font-size: 1.5rem; margin: 4px 0 2px; } h2 { font-size: 1.1rem; margin: 22px 0 8px; color: var(--gold); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .who { color: var(--mut); margin: 0 0 14px; } .datos { font-size: .85rem; color: var(--mut); }
  .turn { margin: 8px 0; } .turn b { color: var(--gold); }
  .nota { background: #f6efe0; border-left: 3px solid var(--gold); padding: 10px 14px; font-size: .92rem; margin-top: 14px; }
  ol.act li { margin: 10px 0 4px; } .lines { border-bottom: 1px solid #bbb; height: 26px; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: .9rem; } th, td { border: 1px solid #bbb; padding: 6px 8px; vertical-align: top; text-align: left; } td { height: 64px; }
  .ronda { margin: 14px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; } .ronda p { margin: 4px 0; }
  .op { display: grid; grid-template-columns: 26px 1fr 160px; gap: 6px; margin: 6px 0; } .op span:last-child { border-bottom: 1px solid #bbb; font-size: .75rem; color: var(--mut); }
  .obra { display: grid; grid-template-columns: 200px 1fr; gap: 16px; margin: 14px 0; page-break-inside: avoid; } .obra img { width: 100%; border: 1px solid var(--line); } .obra .sin { border: 1px dashed #bbb; padding: 20px 10px; font-size: .8rem; color: var(--mut); text-align: center; } .obra small { color: var(--mut); font-size: .72rem; }
  .clave { page-break-before: always; } .clave li { margin: 6px 0; font-size: .9rem; }
  footer { font-size: .75rem; color: var(--mut); margin-top: 18px; }
  @media print { .bar { display: none; } body { background: #fff; } main { padding: 0; max-width: none; } .ficha { border: 0; border-radius: 0; padding: 0; page-break-after: always; } }
</style>
</head>
<body>
<div class="bar"><b>Fichas para el aula</b>
  <select id="tipo"><option value="versus">Debates entre dos pensadores</option><option value="mesas">Mesas redondas</option><option value="posturas">Debate tú (con solucionario)</option><option value="obras">Museo de obras maestras (con solucionario)</option></select>
  <select id="item"></select>
  <button id="imp">Imprimir</button>
</div>
<main id="out"></main>
<script src="aula-datos.js"></script>
<script>
const D = AULA_DATOS, S = D.sabios; const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const n = (id) => (S[id] ? S[id].n : id);
const lines = (k) => '<div class="lines"></div>'.repeat(k);
const pie = '<footer>Odisea de la Razón · filosofiaparasereshumanos.com · Los diálogos son conversaciones imaginadas a partir de las ideas y textos reales de cada pensador.</footer>';
function datos(id) { const s = S[id]; return s ? `${esc(s.f)} (${esc(s.d)}) · ${esc(s.era)}` : ''; }
function versus(v) {
  return `<section class="ficha"><div class="eyebrow">Debate entre pensadores · ${esc(D.temas[v.tema] || '')}</div><h1>${esc(v.q)}</h1>
  <p class="who">${esc(n(v.a))} y ${esc(n(v.b))}</p><p class="datos">${datos(v.a)}<br>${datos(v.b)}</p>
  <h2>El debate</h2>${v.turns.map(([w, t]) => `<p class="turn"><b>${esc(n(w))}:</b> ${esc(t)}</p>`).join('')}
  <h2>Actividades</h2><ol class="act">
  <li>Resume con tus palabras la postura de ${esc(n(v.a))} y la de ${esc(n(v.b))}.${lines(4)}</li>
  <li>Elige el argumento más fuerte de cada uno. ¿Por qué te parece fuerte?${lines(4)}</li>
  <li>¿Hay algún punto débil, alguna falacia o algo que no se responde?${lines(3)}</li>
  <li>¿Quién te convence más? Escribe tu postura en cinco líneas y responde a una objeción del otro lado.${lines(6)}</li></ol>
  <div class="nota"><b>Para el docente:</b> ${esc(v.cierre)}</div>${pie}</section>`;
}
function mesa(m) {
  return `<section class="ficha"><div class="eyebrow">Mesa redonda · ${esc(D.temas[m.tema] || '')}</div><h1>${esc(m.q)}</h1>
  <p class="who">${m.sabios.map((id) => esc(n(id))).join(' · ')}</p><p class="datos">${m.sabios.map(datos).join('<br>')}</p>
  <h2>La conversación</h2>${m.turns.map(([w, t]) => `<p class="turn"><b>${esc(n(w))}:</b> ${esc(t)}</p>`).join('')}
  <h2>Actividades</h2><table><tr><th>Pensador</th><th>Su postura en una frase</th><th>Su mejor argumento</th><th>Una objeción que le harías</th></tr>
  ${m.sabios.map((id) => `<tr><th>${esc(n(id))}</th><td></td><td></td><td></td></tr>`).join('')}</table>
  <ol class="act"><li>¿Qué dos pensadores están más cerca? ¿Y más lejos? Explica por qué.${lines(3)}</li><li>¿Qué postura te convence más? Defiéndela respondiendo a otro de la mesa.${lines(6)}</li></ol>
  <div class="nota"><b>Posturas:</b> ${m.sabios.map((id) => `${esc(n(id))}: ${esc(m.posturas[id])}`).join(' · ')}<br><b>Síntesis:</b> ${esc(m.cierre)}</div>${pie}</section>`;
}
// orden fijo de las opciones (para que el solucionario coincida)
const orden = (ri) => [[1, 2, 0], [2, 0, 1], [0, 2, 1], [1, 0, 2], [2, 1, 0]][ri % 5];
function postura(p) {
  const R = p.rounds; const L = 'ABC';
  const body = R.map((r, i) => { const o = orden(i).map((k) => r.opts[k]); return `<div class="ronda"><p><b>Ronda ${i + 1}. ${esc(n(p.id))}:</b> ${esc(r.say)}</p>${o.map((x, j) => `<div class="op"><b>${L[j]}</b><span>${esc(x.t)}</span><span>sólido · flojo · falacia: ______</span></div>`).join('')}</div>`; }).join('');
  const key = R.map((r, i) => { const o = orden(i).map((k) => r.opts[k]); return `<li><b>Ronda ${i + 1}:</b> ${o.map((x, j) => `${L[j]} = ${x.k === 'bueno' ? 'argumento sólido' : x.k === 'flojo' ? 'argumento flojo' : 'falacia (' + esc(x.f) + ')'}`).join('; ')}.<br>${o.map((x, j) => `${L[j]}: ${esc(x.why)}`).join(' ')}</li>`; }).join('');
  return `<section class="ficha"><div class="eyebrow">Debate tú · ¿argumento sólido, flojo o falacia?</div><h1>${esc(p.q)}</h1><p class="who">${esc(n(p.id))} defiende su idea. Para cada respuesta, marca si es un argumento sólido, un argumento flojo o una falacia (y cuál).</p><p class="datos">${datos(p.id)}</p>
  ${body}<h2>Para pensar</h2><ol class="act"><li>Elige una ronda y escribe una respuesta mejor que las tres.${lines(4)}</li></ol>
  <div class="clave"><h2>Solucionario (para el docente)</h2><ol>${key}</ol></div>${pie}</section>`;
}
const EPOCAS = { antiguedad: 'Antigüedad', oriente: 'Asia, África y América', renacimiento: 'Renacimiento', barroco: 'Barroco', 'siglo-xviii-xix': 'Siglos XVIII y XIX', 'siglo-xx': 'Siglo XX' };
function obras(lista, titulo) {
  const L = 'ABCD'; const ord = (o, i) => { const k = i % 4; const a = [...o.q.a.slice(1)]; a.splice(k, 0, o.q.a[0]); return [a, k]; };
  const body = lista.map((o, i) => { const [a] = ord(o, i); return `<div class="obra">${o.img ? `<img src="img/obras/${esc(o.img)}" alt="">` : '<div class="sin">Imagen no incluida: obra con derechos de autor.</div>'}<div><b>${i + 1}. ${esc(o.titulo)}</b><br><span class="datos">${esc(o.autor)} · ${esc(o.fecha)} · ${esc(o.tecnica)} · ${esc(o.lugar)}</span><p>${esc(o.texto)}</p><p><i>${esc(o.q.q)}</i><br>${a.map((x, j) => `${L[j]}) ${esc(x)}`).join('&nbsp;&nbsp; ')}</p>${o.credito ? `<small>Imagen: ${esc(o.credito)}</small>` : ''}</div></div>`; }).join('');
  const key = lista.map((o, i) => `<li>${esc(o.titulo)}: ${L[ord(o, i)[1]]}) ${esc(o.q.a[0])}</li>`).join('');
  return `<section class="ficha"><div class="eyebrow">Museo de obras maestras</div><h1>${esc(titulo)}</h1><p class="who">Observa cada obra, lee su ficha y responde la pregunta.</p>${body}
  <h2>Para pensar</h2><ol class="act"><li>Elige la obra que más te impresione. Descríbela como si se la contaras a alguien que no puede verla.${lines(4)}</li><li>¿Qué tiene de bello? ¿Es bello lo mismo para todos? Responde con un argumento.${lines(4)}</li></ol>
  <div class="clave"><h2>Solucionario (para el docente)</h2><ol>${key}</ol></div>${pie}</section>`;
}
function fill() {
  const t = $('#tipo').value; const it = $('#item'); if (t === 'obras') { it.innerHTML = '<option value="*">Todas</option>' + Object.entries(EPOCAS).map(([k, v]) => `<option value="${k}">${v}</option>`).join(''); it.value = 'antiguedad'; render(); return; } const L = D[t]; it.innerHTML = '<option value="*">Todas</option>' + L.map((x, i) => `<option value="${i}">${esc(t === 'posturas' ? n(x.id) + ': ' + x.q : x.q)}</option>`).join('');
  it.value = '0'; render();
}
function render() { const t = $('#tipo').value, v = $('#item').value; if (t === 'obras') { const L = v === '*' ? D.obras : D.obras.filter((o) => o.epoca === v); $('#out').innerHTML = obras(L, v === '*' ? 'Todas las obras' : EPOCAS[v]); return; } const f = t === 'versus' ? versus : t === 'mesas' ? mesa : postura; const L = D[t]; $('#out').innerHTML = (v === '*' ? L : [L[+v]]).map(f).join(''); }
$('#tipo').onchange = fill; $('#item').onchange = render; $('#imp').onclick = () => print();
const q = new URLSearchParams(location.search); if (q.get('tipo') && D[q.get('tipo')]) $('#tipo').value = q.get('tipo'); fill();
</script>
</body>
</html>
